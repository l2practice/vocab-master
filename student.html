<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231B7F5E'/%3E%3Ctext x='12' y='17' text-anchor='middle' font-size='13' font-weight='700' fill='%23fff' font-family='system-ui'%3EV%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#1B7F5E">
<title>VocabMaster</title>
<link rel="stylesheet" href="vm-theme.css">
<style>
#app{min-height:100vh}

/* Loading overlay */
.vm-overlay{position:fixed;inset:0;background:rgba(13,79,58,.55);z-index:8888;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.vm-overlay.show{display:flex}
.vm-overlay .vm-spin{width:38px;height:38px;border-width:4px}
.vm-overlay p{color:#fff;font-size:.95rem;font-weight:600;margin:0}

/* CEFR Reader */
.cefr-shell{display:grid;grid-template-columns:1fr 300px;gap:18px;margin-top:12px}
.cefr-filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--vm-surface);border:1px solid var(--vm-border-2);border-radius:var(--vm-r-sm);padding:9px 12px;margin-bottom:10px;font-size:.8rem}
.cefr-filterbar label{display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:600;user-select:none;transition:opacity .15s}
.cefr-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.cefr-count{font-size:.68rem;color:var(--vm-ink-3);font-weight:400}
.cefr-sep{color:var(--vm-border);font-size:1.1rem;margin:0 2px}
.cefr-passage{background:var(--vm-surface);border:1px solid var(--vm-border-2);border-radius:var(--vm-r);padding:20px 22px;line-height:2.1;font-size:.97rem;color:var(--vm-ink);min-height:180px}
.vm-cefr-word{cursor:pointer;border-radius:3px;transition:filter .1s}
.vm-cefr-word:hover{filter:brightness(.85)}
.cefr-right-panel{display:flex;flex-direction:column;gap:12px}
.cefr-breakdown{background:var(--vm-surface);border:1px solid var(--vm-border-2);border-radius:var(--vm-r-sm);padding:12px 14px}
.cefr-breakdown h4{margin:0 0 9px;font-size:.8rem;font-weight:700;color:var(--vm-ink)}
.cefr-bd-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:.75rem}
.cefr-bd-row .lbl{width:26px;font-weight:700}
.cefr-bd-bw{flex:1;background:var(--vm-border-2);border-radius:4px;height:6px;overflow:hidden}
.cefr-bd-b{height:100%;border-radius:4px;transition:width .4s}
.cefr-bd-pct{width:32px;text-align:right;color:var(--vm-ink-3);font-size:.7rem}
.cefr-colloc{background:var(--vm-surface);border:1px solid var(--vm-border-2);border-radius:var(--vm-r-sm);padding:12px 14px}
.cefr-colloc h4{margin:0 0 9px;font-size:.8rem;font-weight:700;color:var(--vm-ink)}
.cefr-colloc-item{border-left:3px solid var(--vm-accent);padding:6px 9px;margin-bottom:7px;background:var(--vm-surface-2);border-radius:0 5px 5px 0}
.cefr-colloc-phrase{font-weight:700;font-size:.83rem;color:var(--vm-primary-dk)}
.cefr-colloc-vi{font-size:.74rem;color:var(--vm-ink-3);margin-top:2px}
.cefr-tip{position:fixed;z-index:9990;background:var(--vm-primary-dk);color:#fff;border-radius:10px;padding:10px 14px;font-size:.82rem;max-width:210px;box-shadow:0 8px 30px rgba(0,0,0,.3);pointer-events:auto}

/* Vocab CEFR cards */
.vm-vocab-cefr-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.vm-vocab-cefr-card{background:var(--vm-surface);border:1px solid var(--vm-border-2);border-radius:8px;padding:9px 12px;min-width:130px;max-width:190px;box-shadow:var(--vm-shadow-sm)}
.vm-vocab-cefr-card .vc-word{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:5px}
.vm-vocab-cefr-card .vc-ipa{font-size:.74rem;color:var(--vm-ink-3);margin-top:2px}
.vm-vocab-cefr-card .vc-vi{font-size:.78rem;color:var(--vm-primary-dk);margin-top:3px;font-style:italic}
.vm-cefr-badge{display:inline-block;font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:7px;color:#fff;vertical-align:middle;line-height:1.4}

/* Review Timer */
.review-shell{display:grid;grid-template-columns:1fr 280px;gap:16px;height:calc(100vh - 210px);min-height:380px}
.review-passage-col{display:flex;flex-direction:column;overflow:hidden}
.review-passage-body{flex:1;overflow-y:auto;background:var(--vm-surface);border:1px solid var(--vm-border-2);border-radius:var(--vm-r);padding:18px 20px;line-height:2;font-size:.93rem}
.review-vocab-col{overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.rv-card{background:var(--vm-surface);border:1px solid var(--vm-border-2);border-radius:var(--vm-r-sm);padding:10px 12px;box-shadow:var(--vm-shadow-sm)}
.rv-card .rv-word{font-weight:700;font-size:.95rem;color:var(--vm-ink);display:flex;align-items:center;gap:5px}
.rv-card .rv-badge{display:inline-block;font-size:.58rem;font-weight:700;padding:1px 5px;border-radius:6px;color:#fff}
.rv-card .rv-ipa{font-size:.73rem;color:var(--vm-ink-3);margin-top:2px}
.rv-card .rv-syns{font-size:.75rem;color:var(--vm-ink-2);margin-top:3px}
.rv-card .rv-vi{font-size:.78rem;color:var(--vm-primary-dk);font-style:italic;margin-top:3px}
.timer-bar-wrap{height:6px;background:var(--vm-border-2);border-radius:4px;overflow:hidden;margin-bottom:10px}
.timer-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--vm-primary),#1BAF80);transition:width 1s linear}
.timer-bar-fill.warn{background:linear-gradient(90deg,#F59E0B,#EF4444)}
.timer-info{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:.82rem;color:var(--vm-ink-2);font-weight:600}

/* Quiz */
.vm-quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vm-opt{background:var(--vm-surface-2);border:2px solid var(--vm-border);border-radius:var(--vm-r-sm);padding:14px 16px;cursor:pointer;font-size:.93rem;font-weight:500;transition:border .15s,background .15s;text-align:center;font-family:var(--vm-font-body);-webkit-tap-highlight-color:transparent}
.vm-opt:active{transform:scale(.97)}
.vm-opt.selected{border-color:var(--vm-primary);background:var(--vm-primary-lt);color:var(--vm-primary-dk)}
.vm-opt.correct{border-color:var(--vm-ok)!important;background:#E3F5EE!important;color:#0A4D28!important}
.vm-opt.wrong{border-color:var(--vm-danger)!important;background:#FDECEA!important;color:#8B1A1A!important}
.vm-opt:disabled{cursor:default}
.vm-quiz-submit{width:100%;margin-top:14px;padding:13px}
.vm-quiz-input{width:100%;font-size:1.05rem;padding:13px 15px;border:2px solid var(--vm-border);border-radius:var(--vm-r-sm);font-family:var(--vm-font-display);font-weight:600;text-align:center;transition:border .15s}
.vm-quiz-input:focus{outline:none;border-color:var(--vm-primary);box-shadow:var(--vm-ring)}
.vm-quiz-input.correct{border-color:var(--vm-ok)!important;background:#E3F5EE!important}
.vm-quiz-input.wrong{border-color:var(--vm-danger)!important;background:#FDECEA!important}
.vm-quiz-fb{margin-top:10px;font-size:.9rem;font-weight:600;min-height:22px}
.vm-quiz-fb.ok{color:var(--vm-ok)}.vm-quiz-fb.bad{color:var(--vm-danger)}
@keyframes vm-perfect{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.vm-perfect-anim{animation:vm-perfect .6s ease}

/* Mobile */
@media(max-width:640px){
  .cefr-shell{grid-template-columns:1fr}
  .cefr-right-panel{display:none}
  .review-shell{grid-template-columns:1fr;height:auto}
  .review-passage-body{max-height:42vh}
  .review-vocab-col{flex-direction:row;flex-wrap:wrap;overflow-x:auto;gap:8px}
  .rv-card{min-width:140px;flex:0 0 auto}
  .vm-quiz-options{grid-template-columns:1fr}
  .vm-kpi-row{grid-template-columns:repeat(3,1fr)}
  .vm-kpi-value{font-size:1.4rem}
  .vm-assign-grid{grid-template-columns:1fr}
  .vm-content{padding:14px 12px}
  .vm-topbar{padding:12px 14px}
}
@media(max-width:380px){.vm-kpi-row{grid-template-columns:1fr 1fr}}

/* ReadWise specific */
.rw-stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.rw-stat-card{background:var(--vm-surface);border:1px solid var(--vm-border-2);border-radius:var(--vm-r-sm);padding:12px 14px;text-align:center}
.rw-stat-val{font-family:var(--vm-font-display);font-size:1.6rem;font-weight:700;color:var(--vm-ink)}
.rw-stat-lbl{font-size:.72rem;color:var(--vm-ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.rw-article-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rw-article-card{background:var(--vm-surface);border:2px solid var(--vm-border-2);border-radius:var(--vm-r);padding:18px 20px;cursor:pointer;transition:transform .13s,box-shadow .15s,border-color .15s;box-shadow:var(--vm-shadow-sm)}
.rw-article-card:hover{transform:translateY(-3px);box-shadow:var(--vm-shadow-lg);border-color:var(--vm-primary)}
.rw-article-title{font-family:var(--vm-font-display);font-weight:700;font-size:.98rem;color:var(--vm-ink);margin:0 0 6px}
.rw-article-meta{font-size:.76rem;color:var(--vm-ink-3);display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>

<!-- Global loading overlay -->
<div class="vm-overlay" id="globalOverlay">
  <span class="vm-spin"></span>
  <p id="overlayMsg">Loading…</p>
</div>

<div id="app"></div>

<script src="vm-common.js"></script>
<script src="cefr-dict.js"></script>
<script src="vm-cefr.js"></script>
<script>
if (typeof VM === 'undefined') { location.href='login.html'; throw new Error('no VM'); }
var sess = VM.session.require('student');
if (!sess) throw new Error('not student');
var hasCEFR = typeof VMCEFR !== 'undefined';
var LC = {'1':'#22C55E','2':'#3B82F6','3':'#F59E0B','4':'#EF4444','5':'#8B5CF6','6':'#EC4899'};
var LN = {'A1':'1','A2':'2','B1':'3','B2':'4','C1':'5','C2':'6'};

/* ── Loading overlay ─────────────────────────── */
function showOverlay(msg){
  document.getElementById('overlayMsg').textContent = msg||'Loading…';
  document.getElementById('globalOverlay').classList.add('show');
}
function hideOverlay(){ document.getElementById('globalOverlay').classList.remove('show'); }

/* ── State ───────────────────────────────────── */
var S = { assignments:[], myResults:[], activeTab:'home' };

/* ── Shell ───────────────────────────────────── */
VM.renderShell({
  mount:'app', eyebrow:'VocabMaster', title:'Home', user:sess,
  nav:[
    {id:'home',    label:'Home',         icon:'overview'},
    {id:'homework',label:'Homework',      icon:'hw'},
    {id:'inclass', label:'In-class',      icon:'inclass'},
    {id:'reading', label:'ReadWise',      icon:'reading'},
    {id:'history', label:'History',       icon:'results'},
  ],
  onNav: switchTab
});

function switchTab(id){
  S.activeTab=id;
  VM.setActiveNav(id);
  var titles={home:'Home',homework:'Homework',inclass:'In-class Review',reading:'ReadWise',history:'History'};
  VM.setTitle(titles[id]||id);
  var c=document.getElementById('vmContent');
  c.innerHTML='<div class="vm-empty" style="padding:40px"><span class="vm-spin-dark" style="width:22px;height:22px;border-width:3px"></span></div>';
  if(id==='home')      renderHome();
  else if(id==='homework') renderAssignList('homework');
  else if(id==='inclass')  renderAssignList('inclass');
  else if(id==='reading')  renderReadWise();
  else if(id==='history')  renderHistory();
}

function loadAssignments(cb){
  VM.api('assign.forStudent',{classId:sess.class}).then(function(res){
    if(res&&res.success) S.assignments=res.data||[];
    if(cb) cb();
  }).catch(function(){ if(cb) cb(); });
}
function loadMyResults(cb){
  VM.api('result.getForStudent',{studentId:sess.studentId}).then(function(res){
    if(res&&res.success) S.myResults=res.data||[];
    if(cb) cb();
  }).catch(function(){ if(cb) cb(); });
}

/* ── Home ─────────────────────────────────────── */
function renderHome(){
  loadAssignments(function(){
    loadMyResults(function(){
      var c=document.getElementById('vmContent');
      var hw=S.assignments.filter(function(a){return a.mode==='homework';});
      var ic=S.assignments.filter(function(a){return a.mode==='inclass';});
      var done=hw.filter(function(a){return isPerfectGoalMet(a,myResultsFor(a.assignmentId));}).length;
      c.innerHTML=
        '<div id="vmTodaysWord"></div>'+
        '<div class="vm-kpi-row">'+
          kpi(hw.length,'Homework','open')+kpi(ic.length,'In-class','open')+kpi(done,'Done','homework')+
        '</div>'+
        '<h3 style="font-family:var(--vm-font-display);margin:0 0 12px;font-size:1rem">📝 Homework</h3>'+
        renderCards(hw.slice(0,4))+
        '<h3 style="font-family:var(--vm-font-display);margin:20px 0 12px;font-size:1rem">🖥️ In-class</h3>'+
        renderCards(ic.slice(0,4));
      VM.renderTodaysWord('vmTodaysWord');
      bindCards();
    });
  });
}
function kpi(v,l,s){
  return '<div class="vm-kpi"><div class="vm-kpi-label">'+l+'</div>'+
    '<div class="vm-kpi-value">'+v+'</div>'+(s?'<div class="vm-kpi-sub">'+s+'</div>':'')+
  '</div>';
}

/* ── Assignment cards ────────────────────────── */
function renderAssignList(mode){
  showOverlay('Loading assignments…');
  loadAssignments(function(){
    loadMyResults(function(){
      hideOverlay();
      var c=document.getElementById('vmContent');
      var items=S.assignments.filter(function(a){return a.mode===mode;});
      c.innerHTML=items.length?renderCards(items):'<div class="vm-empty"><p>No assignments yet.</p></div>';
      bindCards();
    });
  });
}

function myResultsFor(aid){ return S.myResults.filter(function(r){return r.assignmentId===aid;}); }
function isPerfectGoalMet(a,res){
  if(a.mode!=='homework') return false;
  var req=parseInt(a.requiredGoals,10)||3;
  return res.filter(function(r){return r.isPerfect;}).length>=req;
}

function renderCards(items){
  if(!items.length) return '<div class="vm-empty"><p>No assignments.</p></div>';
  return '<div class="vm-assign-grid">'+items.map(function(a){
    var res=myResultsFor(a.assignmentId);
    var att=res.length, perf=res.filter(function(r){return r.isPerfect;}).length;
    var req=parseInt(a.requiredGoals,10)||3;
    var done=a.mode==='homework'&&perf>=req;
    var pct=a.mode==='homework'?Math.min(100,Math.round(perf/req*100)):0;
    var dl=a.deadline?'⏰ '+VM.esc(a.deadline):'∞ No deadline';
    return '<div class="vm-assign-card'+(done?' complete':'')+'" data-open-asgn="'+VM.esc(a.assignmentId)+'">'+
      '<div style="display:flex;justify-content:space-between;gap:8px">'+
        '<div class="vm-assign-card-title">'+VM.esc(a.title)+'</div>'+
        (done?'<span style="color:var(--vm-ok);font-size:1.1rem;flex:0 0 auto">✓</span>':'')+
      '</div>'+
      '<div class="vm-assign-meta"><span>📚 '+(a.vocab||[]).length+' words</span><span>'+dl+'</span></div>'+
      (a.mode==='homework'?
        '<div class="vm-assign-progress">'+
          '<div style="display:flex;justify-content:space-between;font-size:.76rem;font-weight:600">'+
            '<span>Goals: <b style="color:'+(done?'var(--vm-ok)':'var(--vm-primary)')+'">'+perf+'/'+req+'</b></span>'+
            '<span style="color:var(--vm-ink-3)">Attempts: '+att+'</span>'+
          '</div>'+
          '<div class="vm-assign-pbar"><div class="vm-assign-pfill'+(done?' done':'')+'" style="width:'+pct+'%"></div></div>'+
        '</div>':
        '<div style="font-size:.76rem;color:var(--vm-ink-3)">Attempts: '+att+'</div>')+
      '<button class="vm-btn vm-btn-primary vm-btn-block" style="padding:10px;font-size:.88rem;margin-top:6px">'+(att?'Try again →':'Start →')+'</button>'+
    '</div>';
  }).join('')+'</div>';
}

function bindCards(){
  VM.els('[data-open-asgn]').forEach(function(card){
    card.onclick=function(){
      var aId=card.getAttribute('data-open-asgn');
      var asgn=S.assignments.find(function(a){return a.assignmentId===aId;});
      if(!asgn) return;
      if(asgn.mode==='homework') openReview(asgn);
      else openQuizDirect(asgn);
    };
  });
}

/* ── Review (6-min mandatory read) ──────────── */
var _reviewTimer=null;
function openReview(asgn){
  var c=document.getElementById('vmContent');
  VM.setTitle(asgn.title);
  var res=myResultsFor(asgn.assignmentId);
  var hasPerfect=res.filter(function(r){return r.isPerfect;}).length>0;
  var REVIEW_SEC=360;
  var remaining=REVIEW_SEC;
  var vocab=asgn.vocab||[];
  var passage=asgn.reading||'';

  var passageHtml;
  if(hasCEFR&&passage){
    var meanings={};
    vocab.forEach(function(v){ if(v.vi||v.meaningVi) meanings[(v.word||'').toLowerCase()]={vi:v.vi||v.meaningVi||'',ipa:v.ipa||''}; });
    passageHtml=VMCEFR.renderPassage(passage,{
      visibleLevels:{A1:false,A2:false,B1:true,B2:true,C1:true,C2:true},
      meanings:meanings, vocabHighlight:vocab.map(function(v){return v.word;})
    });
  } else {
    passageHtml=passage?VM.esc(passage).replace(/\n/g,'<br>'):'<em style="color:var(--vm-ink-3)">No reading passage.</em>';
  }

  var vocabHtml=vocab.map(function(v){
    var lemma=hasCEFR?VMCEFR.lemmatize((v.word||'').toLowerCase()):null;
    var entry=lemma&&typeof CEFR_MAP!=='undefined'?CEFR_MAP[lemma]:null;
    var lvInfo=entry?entry.split('|')[0]:null;
    var lvNum=lvInfo?lvInfo[0]:null;
    var lvName=lvNum&&VMCEFR?VMCEFR.LEVEL_NAME[lvNum]:null;
    var lvCol=lvNum?LC[lvNum]:'#999';
    var syns=(v.synonyms||[]).slice(0,3).join(', ');
    return '<div class="rv-card">'+
      '<div class="rv-word">'+VM.esc(v.word||'')+
        (lvName?'<span class="rv-badge" style="background:'+lvCol+'">'+lvName+'</span>':'')+
      '</div>'+
      (v.ipa?'<div class="rv-ipa">/'+VM.esc(v.ipa)+'/</div>':'')+
      (syns?'<div class="rv-syns">'+VM.esc(syns)+'</div>':'')+
      ((v.vi||v.meaningVi)?'<div class="rv-vi">'+VM.esc(v.vi||v.meaningVi)+'</div>':'')+
    '</div>';
  }).join('');

  c.innerHTML=
    '<button class="vm-btn vm-btn-ghost vm-btn-sm" id="rvBack" style="margin-bottom:12px">← Back</button>'+
    '<div class="timer-info">'+
      '<span id="rvLabel">📖 Read & review vocabulary before the quiz</span>'+
      '<span id="rvTime" style="font-size:1rem;font-family:var(--vm-font-display)">6:00</span>'+
    '</div>'+
    '<div class="timer-bar-wrap"><div class="timer-bar-fill" id="rvBar" style="width:100%"></div></div>'+
    '<div class="review-shell">'+
      '<div class="review-passage-col">'+
        '<div class="review-passage-body" id="rvPassage">'+
          '<h3 style="font-family:var(--vm-font-display);font-size:1rem;margin:0 0 12px;color:var(--vm-primary-dk)">📖 '+VM.esc(asgn.title)+'</h3>'+
          (passage?passageHtml:'<em style="color:var(--vm-ink-3)">No reading passage for this assignment.</em>')+
        '</div>'+
      '</div>'+
      '<div class="review-vocab-col">'+
        '<div style="font-size:.72rem;font-weight:700;color:var(--vm-ink-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Target Words</div>'+
        (vocabHtml||'<div style="color:var(--vm-ink-3);font-size:.82rem">No vocabulary.</div>')+
      '</div>'+
    '</div>'+
    '<div style="text-align:center;margin-top:16px">'+
      '<button class="vm-btn vm-btn-primary" id="rvStart" style="padding:13px 32px;font-size:1rem" disabled>⏳ Please wait…</button>'+
      (hasPerfect?'<br><button class="vm-btn vm-btn-ghost vm-btn-sm" id="rvSkip" style="margin-top:8px">Skip review (already scored 100%)</button>':'')+
    '</div>';

  document.getElementById('rvBack').onclick=function(){ clearReviewTimer(); switchTab(S.activeTab); };
  if(hasPerfect) document.getElementById('rvSkip').onclick=function(){ clearReviewTimer(); openQuizDirect(asgn); };

  if(hasCEFR){
    setTimeout(function(){
      var m2={};
      vocab.forEach(function(v){ m2[(v.word||'').toLowerCase()]={vi:v.vi||v.meaningVi||'',ipa:v.ipa||''}; });
      VM.els('.vm-cefr-word').forEach(function(span){
        span.onclick=function(){ showCEFRTip(span,span.getAttribute('data-word'),span.getAttribute('data-level'),m2[span.getAttribute('data-word').toLowerCase()]||null); };
      });
    },100);
  }

  if(_reviewTimer) clearInterval(_reviewTimer);
  _reviewTimer=setInterval(function(){
    remaining--;
    var bar=document.getElementById('rvBar');
    var timeEl=document.getElementById('rvTime');
    var startBtn=document.getElementById('rvStart');
    if(!bar){clearInterval(_reviewTimer);return;}
    var pct=Math.round(remaining/REVIEW_SEC*100);
    bar.style.width=pct+'%';
    if(remaining<=60) bar.classList.add('warn');
    var m=Math.floor(remaining/60),s=remaining%60;
    if(timeEl) timeEl.textContent=m+':'+(s<10?'0':'')+s;
    if(remaining<=0){
      clearInterval(_reviewTimer);
      if(startBtn){startBtn.disabled=false;startBtn.textContent='▶ Start Quiz';}
      if(timeEl) timeEl.textContent='';
      var lbl=document.getElementById('rvLabel');
      if(lbl) lbl.textContent='✅ Ready to start!';
    } else {
      if(startBtn) startBtn.textContent='⏳ '+remaining+'s remaining…';
    }
  },1000);

  document.getElementById('rvStart').onclick=function(){ clearReviewTimer(); openQuizDirect(asgn); };
}
function clearReviewTimer(){ if(_reviewTimer){clearInterval(_reviewTimer);_reviewTimer=null;} }

/* ── Quiz ─────────────────────────────────────── */
function openQuizDirect(asgn){
  clearReviewTimer();
  var c=document.getElementById('vmContent');
  VM.setTitle(asgn.title);
  var modes=[{id:'choice',label:'✦ MCQ'},{id:'blank',label:'✍ Fill Blank'},{id:'spell',label:'🔤 Spell'}];
  c.innerHTML=
    '<button class="vm-btn vm-btn-ghost vm-btn-sm" id="qBack" style="margin-bottom:12px">← Back</button>'+
    '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">'+
      modes.map(function(m){return '<button class="vm-mode-chip'+(m.id==='choice'?' active':'')+'" data-qmode="'+m.id+'">'+m.label+'</button>';}).join('')+
    '</div><div id="quizArea"></div>';
  document.getElementById('qBack').onclick=function(){ S.quiz=null; switchTab(S.activeTab); };
  var curMode='choice';
  VM.els('[data-qmode]').forEach(function(btn){
    btn.onclick=function(){
      curMode=btn.getAttribute('data-qmode');
      VM.els('[data-qmode]').forEach(function(b){b.classList.toggle('active',b===btn);});
      startQuiz(asgn,curMode);
    };
  });
  startQuiz(asgn,'choice');
}

function startQuiz(asgn,mode){
  var vocab=asgn.vocab||[];
  if(!vocab.length){document.getElementById('quizArea').innerHTML='<div class="vm-empty"><p>No vocabulary in this assignment.</p></div>';return;}
  S.quiz=VM.buildQuiz(vocab,{mode:mode,shuffle:true});
  S.quizState={asgn:asgn,qIdx:0,correct:0,startTs:Date.now(),quizMode:mode};
  renderQ();
}

function renderQ(){
  var qs=S.quizState,q=S.quiz.questions[qs.qIdx],total=S.quiz.questions.length;
  var pct=Math.round(qs.qIdx/total*100);
  var isChoice=S.quiz.mode==='choice'||S.quiz.mode==='match';
  document.getElementById('quizArea').innerHTML=
    '<div class="vm-quiz-wrap">'+
      '<div class="vm-quiz-header">'+
        '<div class="vm-quiz-progress">Question '+(qs.qIdx+1)+'/'+total+
          '<div class="vm-quiz-bar"><div class="vm-quiz-bar-fill" style="width:'+pct+'%"></div></div>'+
        '</div>'+
        '<span style="font-size:.8rem;color:var(--vm-ink-3)">✓ '+qs.correct+'</span>'+
      '</div>'+
      '<div class="vm-quiz-card">'+
        '<div class="vm-quiz-q">'+VM.esc(q.prompt)+'</div>'+
        (q.subprompt&&q.subprompt!==q.prompt?'<div class="vm-quiz-hint">'+VM.esc(q.subprompt)+'</div>':'')+
        (q.hint?'<div class="vm-quiz-hint">'+VM.esc(q.hint)+'</div>':'')+
        buildInput(q,isChoice)+
      '</div>'+
    '</div>';
  bindInput(q,isChoice);
}

function buildInput(q,isChoice){
  if(isChoice)
    return '<div class="vm-quiz-options">'+
      q.options.map(function(opt){return '<button class="vm-opt" data-ans="'+VM.esc(opt)+'">'+VM.esc(opt)+'</button>';}).join('')+
    '</div><div class="vm-quiz-fb" id="qFb"></div>'+
    '<button class="vm-btn vm-btn-primary vm-quiz-submit" id="qSubmit" disabled>Confirm</button>';
  return '<input class="vm-quiz-input" id="qInput" placeholder="Type your answer…" autocomplete="off" spellcheck="false">'+
    '<div class="vm-quiz-fb" id="qFb"></div>'+
    '<button class="vm-btn vm-btn-primary vm-quiz-submit" id="qSubmit" style="margin-top:12px" disabled>Confirm</button>';
}

function bindInput(q,isChoice){
  var answered=false,selected=null;
  function confirm(){
    if(answered) return;
    if(isChoice&&!selected) return;
    if(!isChoice){var inp=document.getElementById('qInput');if(!inp||!inp.value.trim()) return;selected=inp.value.trim();}
    answered=true;
    var res=S.quiz.check(S.quizState.qIdx,selected);
    var fb=document.getElementById('qFb'),sub=document.getElementById('qSubmit');
    if(sub){sub.disabled=true;sub.textContent='Submitted';}
    if(isChoice){
      VM.els('[data-ans]').forEach(function(btn){
        btn.disabled=true;btn.classList.remove('selected');
        if(btn.getAttribute('data-ans')===q.answer) btn.classList.add('correct');
        else if(btn.getAttribute('data-ans')===selected&&!res.correct) btn.classList.add('wrong');
      });
    } else {
      var inp2=document.getElementById('qInput');
      if(inp2){inp2.disabled=true;inp2.classList.add(res.correct?'correct':'wrong');}
    }
    if(fb){fb.className='vm-quiz-fb '+(res.correct?'ok':'bad');fb.textContent=res.correct?'✓ Correct!':'✗ Answer: '+res.correctAnswer;}
    if(res.correct) S.quizState.correct++;
    setTimeout(function(){
      S.quizState.qIdx++;
      if(S.quizState.qIdx>=S.quiz.questions.length) showResult();
      else renderQ();
    },res.correct?900:1800);
  }
  if(isChoice){
    VM.els('[data-ans]').forEach(function(btn){
      btn.onclick=function(){
        if(answered) return;
        selected=btn.getAttribute('data-ans');
        VM.els('[data-ans]').forEach(function(b){b.classList.remove('selected');});
        btn.classList.add('selected');
        var sub=document.getElementById('qSubmit');
        if(sub) sub.disabled=false;
      };
    });
    var sub=document.getElementById('qSubmit');
    if(sub) sub.onclick=confirm;
  } else {
    var inp=document.getElementById('qInput'),sub2=document.getElementById('qSubmit');
    if(inp){
      inp.focus();
      inp.oninput=function(){if(sub2) sub2.disabled=!inp.value.trim();};
      inp.onkeydown=function(e){if(e.key==='Enter'&&sub2&&!sub2.disabled) confirm();};
    }
    if(sub2){sub2.onclick=confirm;}
  }
}

function showResult(){
  var qs=S.quizState,total=S.quiz.questions.length;
  var score=Math.round(qs.correct/total*100),isPerfect=score===100;
  var dur=Math.round((Date.now()-qs.startTs)/1000);
  var asgn=qs.asgn;
  showOverlay('Saving result…');
  VM.api('result.save',{
    studentId:sess.studentId,name:sess.name,class:sess.class||asgn.classId,
    assignmentId:asgn.assignmentId,title:asgn.title,mode:asgn.mode,
    score:score,isPerfect:isPerfect,durationSec:dur,correct:qs.correct,total:total
  }).then(function(r){
    hideOverlay();
    if(r&&r.success) loadMyResults(function(){});
    else VM.toast('Failed to save result.','err');
  }).catch(function(){ hideOverlay(); VM.toast('Connection error.','err'); });

  var lr=S.myResults.filter(function(r){return r.assignmentId===asgn.assignmentId;});
  var perfects=lr.filter(function(r){return r.isPerfect;}).length+(isPerfect?1:0);
  var attempts=lr.length+1;
  var req=parseInt(asgn.requiredGoals,10)||3;
  var goalMet=asgn.mode==='homework'&&perfects>=req;
  var sc=score===100?'var(--vm-ok)':(score>=60?'#A66B00':'var(--vm-danger)');

  document.getElementById('quizArea').innerHTML=
    '<div class="vm-result-banner'+(isPerfect?' vm-perfect-anim':'')+'" style="margin-top:8px">'+
      (isPerfect?'<div style="font-size:2.4rem;margin-bottom:6px">🎉</div>':'')+
      '<div class="vm-result-score" style="color:'+sc+'">'+score+'%</div>'+
      '<div class="vm-result-label">'+qs.correct+'/'+total+' correct</div>'+
      '<div class="vm-result-badges" style="margin-top:14px">'+
        bdg(VM.fmtDuration(dur),'Duration')+
        (asgn.mode==='homework'?
          bdg(attempts,'Attempts')+
          '<div class="vm-result-badge"><div class="val" style="color:'+(goalMet?'var(--vm-ok)':'var(--vm-ink)')+'">'+perfects+'/'+req+'</div>'+
          '<div class="lbl">Goals'+(goalMet?' ✓':'')+'</div></div>':'') +
      '</div>'+
      (goalMet?'<div style="margin-top:14px;color:var(--vm-ok);font-weight:700">🏆 Goal achieved!</div>':
        (asgn.mode==='homework'?'<div style="margin-top:8px;font-size:.82rem;color:var(--vm-ink-3)">Need '+(req-perfects)+' more 100% run(s).</div>':''))+
      '<div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap">'+
        '<button class="vm-btn vm-btn-primary" id="tryAgain" style="padding:11px 24px">Try Again</button>'+
        '<button class="vm-btn vm-btn-ghost" id="backRes" style="padding:11px 20px">← Back</button>'+
      '</div>'+
    '</div>';
  document.getElementById('tryAgain').onclick=function(){startQuiz(asgn,qs.quizMode);};
  document.getElementById('backRes').onclick=function(){switchTab(S.activeTab);};
}
function bdg(v,l){
  return '<div class="vm-result-badge"><div class="val">'+VM.esc(String(v))+'</div><div class="lbl">'+VM.esc(l)+'</div></div>';
}

/* ── CEFR tooltip ────────────────────────────── */
function showCEFRTip(anchor,word,level,mData){
  var old=document.getElementById('cefrTip'); if(old) old.remove();
  var lnum=level&&LN[level]?LN[level]:(level&&/^\d$/.test(level)?level:null);
  var col=lnum?LC[lnum]:'#666';
  var tip=document.createElement('div');
  tip.id='cefrTip';tip.className='cefr-tip';
  tip.innerHTML=
    '<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">'+
      '<b style="font-size:.95rem">'+VM.esc(word)+'</b>'+
      (level?'<span style="background:'+col+';color:#fff;padding:2px 6px;border-radius:7px;font-size:.65rem;font-weight:700">'+level+'</span>':'')+
      '<button onclick="document.getElementById(\'cefrTip\').remove()" style="margin-left:auto;background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:1rem;padding:0">×</button>'+
    '</div>'+
    (mData&&mData.ipa?'<div style="color:#A8E8C8;font-size:.77rem">/'+VM.esc(mData.ipa)+'/</div>':'')+
    (mData&&mData.vi?'<div style="color:#E0F8EE;margin-top:3px">🇻🇳 '+VM.esc(mData.vi)+'</div>':'<div style="color:rgba(255,255,255,.5);font-size:.74rem;margin-top:3px;font-style:italic">No translation yet</div>');
  document.body.appendChild(tip);
  var r=anchor.getBoundingClientRect();
  var tw=Math.min(210,tip.scrollWidth),th=tip.scrollHeight;
  var left=Math.max(8,Math.min(r.left+r.width/2-tw/2,window.innerWidth-tw-8));
  var top=r.top-th-8;if(top<8) top=r.bottom+8;
  tip.style.left=left+'px';tip.style.top=top+'px';
  setTimeout(function(){
    document.addEventListener('click',function ct(e){if(!tip.contains(e.target)&&e.target!==anchor){tip.remove();document.removeEventListener('click',ct);}});
  },10);
}

/* ── ReadWise (self-directed, independent of assignments) ─── */
// ReadWise uses a separate vocab sheet tab — students pick their own articles.
// For now we source articles from assignments that have reading passages,
// but present them as independent reading material (not tied to homework grades).
// Results saved under mode:'readwise' — teacher sees date/time/quiz scores.
var RW_VOCAB_COUNT = 60;   // always pull 60 vocab words
var RW_COMP_COUNT  = 15;   // always 15 comprehension questions

function renderReadWise(){
  showOverlay('Loading ReadWise…');
  VM.api('assign.forStudent',{classId:sess.class}).then(function(res){
    hideOverlay();
    var c=document.getElementById('vmContent');
    var articles=(res&&res.success?res.data||[]:S.assignments).filter(function(a){return a.reading&&a.reading.trim();});

    // Stats from readwise history
    var rwRes=S.myResults.filter(function(r){return r.mode==='readwise';});
    var totalRead=new Set(rwRes.map(function(r){return r.assignmentId;})).size;
    var avgScore=rwRes.length?Math.round(rwRes.reduce(function(s,r){return s+parseFloat(r.score||0);},0)/rwRes.length):0;

    if(!articles.length){
      c.innerHTML=
        '<div class="rw-stats-row">'+
          rwStat(totalRead,'Articles read')+rwStat(avgScore+'%','Avg. score')+
        '</div>'+
        '<div class="vm-empty"><p>No reading articles available yet. Your teacher will add them.</p></div>';
      return;
    }

    c.innerHTML=
      '<div class="rw-stats-row">'+
        rwStat(totalRead,'Articles read')+rwStat(avgScore+'%','Avg. score')+
      '</div>'+
      '<h3 style="font-family:var(--vm-font-display);margin:0 0 14px;font-size:1rem">📚 Available Articles</h3>'+
      '<div class="rw-article-grid">'+
        articles.map(function(a){
          var myRW=rwRes.filter(function(r){return r.assignmentId===a.assignmentId;});
          var attempts=myRW.length;
          var bestScore=attempts?Math.max.apply(null,myRW.map(function(r){return parseFloat(r.score||0);})):null;
          return '<div class="rw-article-card" data-rw-open="'+VM.esc(a.assignmentId)+'">'+
            '<div class="rw-article-title">'+VM.esc(a.title)+'</div>'+
            '<div class="rw-article-meta">'+
              '<span>📖 Reading</span>'+
              '<span>📚 '+(a.vocab||[]).length+' words</span>'+
              (attempts?'<span>✓ '+attempts+' attempt(s) · Best: '+bestScore+'%</span>':'<span>Not started</span>')+
            '</div>'+
            '<button class="vm-btn '+(attempts?'vm-btn-ghost':'vm-btn-primary')+' vm-btn-block" style="padding:9px;font-size:.88rem;margin-top:10px">'+
              (attempts?'Read again →':'Start reading →')+
            '</button>'+
          '</div>';
        }).join('')+
      '</div>';

    VM.els('[data-rw-open]').forEach(function(card){
      card.onclick=function(){
        var a=articles.find(function(x){return x.assignmentId===card.getAttribute('data-rw-open');});
        if(a) openRWArticle(a);
      };
    });
  }).catch(function(){
    hideOverlay();
    document.getElementById('vmContent').innerHTML='<div class="vm-empty"><p>Connection error. Please try again.</p></div>';
  });
}
function rwStat(v,l){
  return '<div class="rw-stat-card"><div class="rw-stat-val">'+VM.esc(String(v))+'</div><div class="rw-stat-lbl">'+VM.esc(l)+'</div></div>';
}

function openRWArticle(asgn){
  var c=document.getElementById('vmContent');
  VM.setTitle(asgn.title);
  var vocab=asgn.vocab||[];
  var vis={A1:true,A2:true,B1:true,B2:true,C1:true,C2:true};
  var meanings={};
  vocab.forEach(function(v){ meanings[(v.word||'').toLowerCase()]={vi:v.vi||v.meaningVi||'',ipa:v.ipa||''}; });
  var gemKey=VM.geminiKey.get();

  function buildPassage(){
    if(!hasCEFR) return VM.esc(asgn.reading||'').replace(/\n/g,'<br>');
    return VMCEFR.renderPassage(asgn.reading||'',{visibleLevels:vis,meanings:meanings,vocabHighlight:vocab.map(function(v){return v.word;})});
  }

  function buildBD(){
    if(!hasCEFR||!asgn.reading) return '';
    var tk=VMCEFR.analyze(asgn.reading);var bd=VMCEFR.breakdown(tk);
    var lvs=['A1','A2','B1','B2','C1','C2'];
    return '<div class="cefr-breakdown"><h4>CEFR Breakdown</h4>'+
      lvs.map(function(lv){
        var count=bd[lv]||0,pct=bd.total?Math.round(count/bd.total*100):0,col=LC[LN[lv]];
        return '<div class="cefr-bd-row"><span class="lbl" style="color:'+col+'">'+lv+'</span>'+
          '<div class="cefr-bd-bw"><div class="cefr-bd-b" style="width:'+pct+'%;background:'+col+'"></div></div>'+
          '<span class="cefr-bd-pct">'+pct+'%</span><span style="font-size:.68rem;color:var(--vm-ink-3);min-width:22px">'+count+'</span></div>';
      }).join('')+
      '<div style="font-size:.7rem;color:var(--vm-ink-3);margin-top:6px">Total: '+bd.total+' words</div></div>';
  }

  function buildFilterBar(){
    if(!hasCEFR) return '';
    var tk=VMCEFR.analyze(asgn.reading||'');var bd=VMCEFR.breakdown(tk);
    var lvs=['A1','A2','B1','B2','C1','C2'];
    return '<div class="cefr-filterbar">'+
      '<span style="font-weight:700;color:var(--vm-ink-3);font-size:.76rem;flex:0 0 auto">CEFR:</span>'+
      lvs.map(function(lv){
        var col=LC[LN[lv]];
        return '<label data-flv="'+lv+'" style="opacity:'+(vis[lv]?1:.38)+'">'+
          '<input type="checkbox" data-lv="'+lv+'" style="display:none" '+(vis[lv]?'checked':'')+'>'+
          '<span class="cefr-dot" style="background:'+col+'"></span>'+
          ' <span style="color:'+col+'">'+lv+'</span> <span class="cefr-count">'+(bd[lv]||0)+'</span></label>';
      }).join('')+
      '<span class="cefr-sep">│</span>'+
      (gemKey
        ? '<button class="vm-btn vm-btn-ghost vm-btn-sm" id="aiBtnR" style="font-size:.75rem;padding:5px 9px">✨ Translate</button>'+
          '<button class="vm-btn vm-btn-ghost vm-btn-sm" id="colBtnR" style="font-size:.75rem;padding:5px 9px">🔗 Collocations</button>'
        : '<button class="vm-btn vm-btn-ghost vm-btn-sm" id="keyBtnR" style="font-size:.75rem;padding:5px 9px">🔑 Add Gemini key</button>')+
    '</div>';
  }

  function render(){
    c.innerHTML=
      '<button class="vm-btn vm-btn-ghost vm-btn-sm" id="rwBack2" style="margin-bottom:10px">← Back</button>'+
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">'+
        '<h2 style="font-family:var(--vm-font-display);font-size:1.15rem;margin:0">'+VM.esc(asgn.title)+'</h2>'+
        '<button class="vm-btn vm-btn-primary" id="startRWQuiz" style="padding:9px 18px;font-size:.88rem">📝 Take Quiz</button>'+
      '</div>'+
      buildFilterBar()+
      (!gemKey?
        '<div style="background:var(--vm-surface-2);border:1px solid var(--vm-border-2);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:.8rem">'+
          '<p style="margin:0 0 7px;font-weight:600;color:var(--vm-ink-2)">Add Gemini API key for AI translation &amp; collocations:</p>'+
          '<div style="display:flex;gap:6px"><input id="rwKeyIn" type="password" placeholder="AIza…" style="flex:1;border:1px solid var(--vm-border);border-radius:6px;padding:6px 8px;font-size:.8rem;background:var(--vm-surface)">'+
          '<button id="rwKeySave" style="background:var(--vm-primary);color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:.77rem;font-weight:600;cursor:pointer">Save</button></div>'+
        '</div>':'') +
      '<div class="cefr-shell">'+
        '<div><div class="cefr-passage" id="rwPassage">'+buildPassage()+'</div></div>'+
        '<div class="cefr-right-panel" id="rwRight">'+
          buildBD()+
          '<div class="cefr-colloc" id="rwCollocBox" style="display:none">'+
            '<h4>🔗 Phrases &amp; Collocations</h4><div id="rwCollocList"></div>'+
          '</div>'+
        '</div>'+
      '</div>';

    document.getElementById('rwBack2').onclick=function(){switchTab('reading');};
    document.getElementById('startRWQuiz').onclick=function(){ openRWQuiz(asgn); };

    // Filter toggles
    VM.els('[data-lv]').forEach(function(inp){
      inp.closest('label').onclick=function(e){
        e.preventDefault();
        var lv=inp.getAttribute('data-lv'); vis[lv]=!vis[lv];
        inp.closest('label').style.opacity=vis[lv]?'1':'.38';
        document.getElementById('rwPassage').innerHTML=buildPassage();
        bindPassClicks();
      };
    });

    var aib=document.getElementById('aiBtnR');
    if(aib) aib.onclick=function(){
      aib.disabled=true;aib.textContent='⏳…';
      var toks=hasCEFR?VMCEFR.analyze(asgn.reading||''):[];
      var words=[],seen={};
      toks.forEach(function(t){if(t.level&&!seen[t.clean.toLowerCase()]){seen[t.clean.toLowerCase()]=1;words.push(t.clean.toLowerCase());}});
      VMCEFR.fetchMeanings(words,gemKey,vocab).then(function(map){
        meanings=map;
        document.getElementById('rwPassage').innerHTML=buildPassage();
        bindPassClicks();
        aib.disabled=false;aib.textContent='✨ Translate';
        VM.toast('Translated '+Object.keys(map).length+' words','ok');
      });
    };

    var cb=document.getElementById('colBtnR');
    if(cb) cb.onclick=function(){
      cb.disabled=true;cb.textContent='⏳…';
      VMCEFR.collocations(asgn.reading||'',gemKey).then(function(list){
        var box=document.getElementById('rwCollocBox'),el=document.getElementById('rwCollocList');
        box.style.display='';
        el.innerHTML=list.map(function(i){
          return '<div class="cefr-colloc-item"><div class="cefr-colloc-phrase">'+VM.esc(i.phrase)+'</div>'+
            '<div class="cefr-colloc-vi">'+VM.esc(i.meaning)+'</div></div>';
        }).join('');
        cb.disabled=false;cb.textContent='🔗 Collocations';
        VM.toast(list.length+' phrases found','ok');
      });
    };

    var ks=document.getElementById('rwKeySave');
    if(ks) ks.onclick=function(){
      var v=(document.getElementById('rwKeyIn').value||'').trim();
      if(!v){VM.toast('Enter key.','warn');return;}
      VM.geminiKey.set(v);gemKey=v;render();
    };

    var kb=document.getElementById('keyBtnR');
    if(kb) kb.onclick=function(){
      var box=document.querySelector('.cefr-filterbar + div');
      if(box) box.style.display=box.style.display==='none'?'':'none';
    };

    bindPassClicks();
  }

  function bindPassClicks(){
    VM.els('.vm-cefr-word').forEach(function(span){
      span.onclick=function(){
        showCEFRTip(span,span.getAttribute('data-word'),span.getAttribute('data-level'),meanings[(span.getAttribute('data-word')||'').toLowerCase()]||null);
      };
    });
  }

  render();
}

function openRWQuiz(asgn){
  var vocab=asgn.vocab||[];
  // Build comprehension questions from vocab (definition matching, up to RW_VOCAB_COUNT)
  var shuffled=VM._shuffle(vocab.slice()).slice(0,RW_VOCAB_COUNT);
  var quiz=VM.buildQuiz(shuffled,{mode:'choice',shuffle:true});

  // Comprehension questions (content-based, up to RW_COMP_COUNT) from passage
  // Simple: fill-in from examples in passage sentences
  var compQ=buildCompQuestions(asgn.reading||'',asgn.vocab||[],RW_COMP_COUNT);

  var allQ=quiz.questions.concat(compQ);
  var c=document.getElementById('vmContent');
  VM.setTitle('ReadWise Quiz — '+asgn.title);

  var qIdx=0,correct=0,startTs=Date.now();

  function renderRWQ(){
    var q=allQ[qIdx],total=allQ.length,pct=Math.round(qIdx/total*100);
    var isComp=q._comp;
    c.innerHTML=
      '<div class="vm-quiz-wrap">'+
        '<div style="font-size:.78rem;color:var(--vm-ink-3);margin-bottom:8px">'+
          (qIdx<quiz.questions.length?'📚 Vocabulary ('+(qIdx+1)+'/'+quiz.questions.length+')':'📖 Comprehension ('+(qIdx-quiz.questions.length+1)+'/'+compQ.length+')')+
        '</div>'+
        '<div class="vm-quiz-header">'+
          '<div class="vm-quiz-progress">Question '+(qIdx+1)+'/'+total+
            '<div class="vm-quiz-bar"><div class="vm-quiz-bar-fill" style="width:'+pct+'%"></div></div>'+
          '</div>'+
          '<span style="font-size:.8rem;color:var(--vm-ink-3)">✓ '+correct+'</span>'+
        '</div>'+
        '<div class="vm-quiz-card">'+
          '<div class="vm-quiz-q">'+VM.esc(q.prompt)+'</div>'+
          '<div class="vm-quiz-options">'+
            q.options.map(function(opt){return '<button class="vm-opt" data-ans="'+VM.esc(opt)+'">'+VM.esc(opt)+'</button>';}).join('')+
          '</div>'+
          '<div class="vm-quiz-fb" id="rwFb"></div>'+
          '<button class="vm-btn vm-btn-primary vm-quiz-submit" id="rwSubmit" disabled>Confirm</button>'+
        '</div>'+
      '</div>';

    var answered=false,selected=null;
    VM.els('[data-ans]').forEach(function(btn){
      btn.onclick=function(){
        if(answered) return;
        selected=btn.getAttribute('data-ans');
        VM.els('[data-ans]').forEach(function(b){b.classList.remove('selected');});
        btn.classList.add('selected');
        document.getElementById('rwSubmit').disabled=false;
      };
    });
    document.getElementById('rwSubmit').onclick=function(){
      if(answered||!selected) return;
      answered=true;
      var isCorrect=selected===q.answer;
      if(isCorrect) correct++;
      VM.els('[data-ans]').forEach(function(btn){
        btn.disabled=true;btn.classList.remove('selected');
        if(btn.getAttribute('data-ans')===q.answer) btn.classList.add('correct');
        else if(btn.getAttribute('data-ans')===selected&&!isCorrect) btn.classList.add('wrong');
      });
      var fb=document.getElementById('rwFb');
      if(fb){fb.className='vm-quiz-fb '+(isCorrect?'ok':'bad');fb.textContent=isCorrect?'✓ Correct!':'✗ Answer: '+q.answer;}
      document.getElementById('rwSubmit').textContent='Submitted';
      setTimeout(function(){qIdx++;if(qIdx>=allQ.length) showRWResult();else renderRWQ();},isCorrect?900:1800);
    };
  }

  function showRWResult(){
    var score=Math.round(correct/allQ.length*100);
    var dur=Math.round((Date.now()-startTs)/1000);
    showOverlay('Saving result…');
    VM.api('result.save',{
      studentId:sess.studentId,name:sess.name,class:sess.class,
      assignmentId:asgn.assignmentId,title:asgn.title,mode:'readwise',
      score:score,isPerfect:score===100,durationSec:dur,correct:correct,total:allQ.length
    }).then(function(r){
      hideOverlay();
      if(r&&r.success) loadMyResults(function(){});
      else VM.toast('Failed to save.','err');
    }).catch(function(){hideOverlay();VM.toast('Connection error.','err');});

    var sc=score>=90?'var(--vm-ok)':(score>=60?'#A66B00':'var(--vm-danger)');
    c.innerHTML=
      '<div class="vm-result-banner'+(score===100?' vm-perfect-anim':'')+'" style="margin-top:8px">'+
        (score===100?'<div style="font-size:2.4rem;margin-bottom:6px">🎉</div>':'')+
        '<div class="vm-result-score" style="color:'+sc+'">'+score+'%</div>'+
        '<div class="vm-result-label">'+correct+'/'+allQ.length+' correct</div>'+
        '<div class="vm-result-badges" style="margin-top:14px">'+
          bdg(VM.fmtDuration(dur),'Duration')+
          bdg(quiz.questions.length,'Vocab Qs')+
          bdg(compQ.length,'Comprehension Qs')+
        '</div>'+
        '<div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap">'+
          '<button class="vm-btn vm-btn-primary" id="rwAgain">Read Again</button>'+
          '<button class="vm-btn vm-btn-ghost" id="rwDone">← Back</button>'+
        '</div>'+
      '</div>';
    document.getElementById('rwAgain').onclick=function(){openRWArticle(asgn);};
    document.getElementById('rwDone').onclick=function(){switchTab('reading');};
  }

  renderRWQ();
}

function buildCompQuestions(passage,vocab,count){
  // Generate simple comprehension MCQs from the passage sentences
  if(!passage) return [];
  var sentences=passage.split(/[.!?]+/).map(function(s){return s.trim();}).filter(function(s){return s.split(/\s+/).length>=6;});
  var qs=[];
  var vocabSet={};
  vocab.forEach(function(v){vocabSet[(v.word||'').toLowerCase()]=v;});

  sentences.slice(0,count*2).forEach(function(sent){
    if(qs.length>=count) return;
    // Find a vocab word in the sentence to blank out
    var words=sent.split(/\s+/);
    var targetIdx=-1,targetWord=null;
    for(var i=0;i<words.length;i++){
      var w=words[i].toLowerCase().replace(/[^a-z]/g,'');
      if(vocabSet[w]&&w.length>3){targetIdx=i;targetWord=w;break;}
    }
    if(targetIdx===-1) return;
    var blanked=words.map(function(w,i){return i===targetIdx?'_____':w;}).join(' ');
    var correct=words[targetIdx];
    // Wrong options from other vocab words
    var others=Object.keys(vocabSet).filter(function(k){return k!==targetWord;});
    var wrong=VM._shuffle(others).slice(0,3).map(function(k){return vocabSet[k].word||k;});
    qs.push({prompt:blanked,options:VM._shuffle([correct].concat(wrong)),answer:correct,_comp:true});
  });

  // If not enough, add definition-matching questions
  var remaining=count-qs.length;
  if(remaining>0&&vocab.length){
    var extra=VM._shuffle(vocab.slice()).slice(0,remaining);
    extra.forEach(function(v){
      var others2=VM._shuffle(vocab.filter(function(x){return x.word!==v.word;})).slice(0,3);
      var opts=VM._shuffle([v].concat(others2)).map(function(x){return x.word;});
      qs.push({prompt:'Which word means: "'+( v.synonyms&&v.synonyms[0]?v.synonyms[0]:v.vi||v.meaningVi||v.word)+'"?',options:opts,answer:v.word,_comp:true});
    });
  }
  return qs.slice(0,count);
}

/* ── History ──────────────────────────────────── */
function renderHistory(){
  showOverlay('Loading history…');
  loadMyResults(function(){
    hideOverlay();
    var c=document.getElementById('vmContent');
    if(!S.myResults.length){c.innerHTML='<div class="vm-empty"><p>No history yet.</p></div>';return;}
    var rows=S.myResults.slice().sort(function(a,b){return new Date(b.timestamp)-new Date(a.timestamp);});
    var modeIcon={homework:'📝',inclass:'🖥️',readwise:'📖'};
    c.innerHTML=
      '<div class="vm-table-wrap"><table class="vm-table"><thead><tr>'+
        '<th>Time</th><th>Assignment</th><th>Mode</th><th>Score</th><th>Correct</th><th>Duration</th>'+
      '</tr></thead><tbody>'+
      rows.map(function(r){
        return '<tr>'+
          '<td style="font-size:.76rem">'+VM.esc(VM.fmtDate(r.timestamp))+'</td>'+
          '<td><b style="font-size:.82rem">'+VM.esc(r.title||r.assignmentId)+'</b></td>'+
          '<td>'+(modeIcon[r.mode]||'')+'<span style="font-size:.76rem;color:var(--vm-ink-3);margin-left:3px">'+VM.esc(r.mode||'')+'</span></td>'+
          '<td class="vm-score '+scoreC(r.score)+'">'+r.score+'%'+(r.isPerfect?' ★':'')+'</td>'+
          '<td>'+r.correct+'/'+r.total+'</td>'+
          '<td>'+VM.fmtDuration(r.durationSec)+'</td>'+
        '</tr>';
      }).join('')+
    '</tbody></table></div>';
  });
}
function scoreC(s){return s>=90?'vm-score-hi':(s>=60?'vm-score-mid':'vm-score-lo');}

document.head.appendChild(mcs);

switchTab('home');
